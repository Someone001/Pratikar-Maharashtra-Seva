name: Pratikar CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Configuration Schemas & Translations
        run: npm run validate-config

      - name: Verify I18n Keys Synchronization
        run: npm run check-i18n

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Strict Type Check
        run: npm run type-check

      - name: Run Vitest Unit & Component Tests
        run: npm test

      - name: Build Static Production PWA Bundle
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E & Accessibility Tests
        run: npx playwright test --project=chromium
